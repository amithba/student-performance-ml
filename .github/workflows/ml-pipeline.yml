name: ML CI CT CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  CI:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -v


  CT:
    name: Continuous Testing
    needs: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train ML model
        run: python src/train.py

      - name: Check model exists
        shell: bash
        run: test -f models/model.pkl

      - name: Run model tests
        run: pytest -v


  CD:
    name: Continuous Deployment
    needs: CT
    runs-on: ubuntu-latest

    steps:
      - name: Deployment
        run: echo "Model deployment completed successfully"